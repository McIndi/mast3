[build-system]
# setuptools 77 is the first release that accepts an SPDX license expression.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mast"
# The MAST version is only set here. mast.__version__ reads it from the
# installed package metadata. From 4.0, it does not follow the bundled
# Python.
version = "4.0.0.dev0"
description = "A utility to help manage multiple IBM DataPower appliances"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "Clifford Bressette", email = "cliffordbressette@mcindi.com" },
]
keywords = ["DataPower", "backup", "checkpoint", "accounts", "network", "ssh", "system"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Topic :: Utilities",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
requires-python = ">=3.13"
# uv.lock pins these for every platform. After a change here, run `uv lock`
# and commit uv.lock. The installer bundles exactly what the lock lists.
dependencies = [
    # The command line and the help.
    "pydantic>=2", "markdown", "pygments", "colorama",
    # The web GUI: a Flask app served by CherryPy.
    "flask", "cherrypy",
    # The appliances: SOMA (XML), SSH, and the crypto and backup reports.
    "lxml", "paramiko", "pyOpenSSL", "python-dateutil", "openpyxl",
    # The job queue. psycopg is the PostgreSQL driver.
    "sqlalchemy>=2", "alembic", "cryptography", "psycopg[binary]",
    # Only for the scripts in contrib.
    "requests", "dulwich",
    # readline for mast-ssh, and the Windows service of mastd.
    "pyreadline3; sys_platform == 'win32'",
    "pywin32; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest",
]

[project.urls]
Homepage = "http://github.com/mcindi/mast"

# The one command of MAST, `mast` (see mast/main.py). The installer has
# its own launcher of the same name.
[project.scripts]
mast = "mast.main:entry"

# The plugins: each one is a provider of commands, see mast/plugins.py
[project.entry-points.mast_plugin]
datapower = "mast.datapower.plugin:manifest"

# The pages of the web UI, see mast/web/page.py
[project.entry-points.mast_web_page]
jobs = "mast.web.pages.jobs:page"
commands = "mast.web.pages.commands:page"
admin = "mast.web.pages.admin:page"
appliances = "mast.datapower.status.page:page"
crypto = "mast.datapower.crypto.page:page"
terminal = "mast.datapower.ssh.page:page"

[project.entry-points.mastd_plugin]
mastd_web_plugin = "mast.web:Plugin"
mastd_cron_plugin = "mast.cron:Plugin"
mastd_worker_plugin = "mast.jobs.worker:Plugin"

# The interpreter that ./mast-setup bundles. The installer ships the
# newest patch release of `python` in the python-build-standalone release
# `python-build-standalone`, so a build of the same commit always ships
# the same interpreter. To upgrade it, run
# `./mast-setup --python-build-standalone latest` and put the release
# that it reports here.
#
# The Linux installer runs on `linux-glibc` and newer (2.28: RHEL 8,
# Debian 10, Ubuntu 20.04). The dependencies are installed from wheels
# for that glibc, whatever the glibc of the build machine. The release
# workflow runs the installer in an image with that glibc.
[tool.mast-setup]
python = "3.15"
python-build-standalone = "20261110"
linux-glibc = "2.28"

[tool.setuptools.packages.find]
include = ["mast", "mast.*"]

[tool.setuptools]
# Only the files named in package-data go into the wheel, as before.
include-package-data = false

[tool.setuptools.package-data]
"mast.web" = ["templates/*", "static/css/*", "static/js/*", "static/vendor/*/*"]
"mast.datapower.crypto" = ["templates/*", "static/*"]
"mast.datapower.ssh" = ["templates/*", "static/*"]
"mast.datapower.status" = ["templates/*", "static/*"]
# The responses of a DataPower and the CycloneDX schemas, for the tests
"mast.testsuite" = ["data/*/*"]
