{% extends "base.html" %}
{% block title %}Log in · MAST{% endblock %}
{% block content %}
<section class="card mast-narrow mx-auto">
    <div class="card-body">
        <h1 class="h4">Log in</h1>
        {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
        <form method="post" action="/login">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <input type="hidden" name="next" value="{{ next }}">
            <div class="mb-3">
                <label class="form-label" for="username">User name</label>
                <input class="form-control" id="username" name="username" autocomplete="username" required autofocus value="{{ username or '' }}">
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="btn btn-primary" type="submit">Log in</button>
        </form>
    </div>
</section>
{% endblock %}
