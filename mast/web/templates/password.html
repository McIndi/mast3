{% extends "base.html" %}
{% block title %}Change password · MAST{% endblock %}
{% block content %}
<section class="card narrow">
    <h1>Change your password</h1>
    {% if user.must_change %}<p>Choose a new password before you go on.</p>{% endif %}
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/account/password">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="current">Current password</label>
        <input id="current" name="current" type="password" autocomplete="current-password" required>
        <label for="new">New password (at least {{ min_length }} characters)</label>
        <input id="new" name="new" type="password" autocomplete="new-password" minlength="{{ min_length }}" required>
        <label for="confirm">New password again</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="{{ min_length }}" required>
        <button type="submit">Change password</button>
    </form>
    <p class="note">This logs out your other sessions.</p>
</section>
{% endblock %}
