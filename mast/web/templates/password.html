{% extends "base.html" %}
{% block title %}Change password · MAST{% endblock %}
{% block content %}
<section class="card mast-narrow mx-auto">
    <div class="card-body">
        <h1 class="h4">Change your password</h1>
        {% if user.must_change %}<div class="alert alert-info">Choose a new password before you go on.</div>{% endif %}
        {% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}
        <form method="post" action="/account/password">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="mb-3">
                <label class="form-label" for="current">Current password</label>
                <input class="form-control" id="current" name="current" type="password" autocomplete="current-password" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="new">New password (at least {{ min_length }} characters)</label>
                <input class="form-control" id="new" name="new" type="password" autocomplete="new-password" minlength="{{ min_length }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label" for="confirm">New password again</label>
                <input class="form-control" id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="{{ min_length }}" required>
            </div>
            <button class="btn btn-primary" type="submit">Change password</button>
        </form>
        <p class="form-text mt-3">This logs out your other sessions.</p>
    </div>
</section>
{% endblock %}
