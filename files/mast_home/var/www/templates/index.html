  <!DOCTYPE html>
<html>
    <head>
        <meta name="csrf-token" content="{{ csrf_token() }}" />
        <meta name="mast-root" content="{{ mast_root }}" />
        <link rel="stylesheet" href="{{ mast_root }}/static/css/jquery-ui.min.css" />
        <link rel="stylesheet" href="{{ mast_root }}/plugins.css" />
        <link rel="stylesheet" href="{{ mast_root }}/static/css/mast.css" />
        <script src='{{ mast_root }}/static/js/chart.umd.js' ></script>
        <script src="{{ mast_root }}/static/js/jquery.min.js"></script>
        <script src="{{ mast_root }}/static/js/jquery.download.js"></script>
        <script src='{{ mast_root }}/static/js/jquery-ui.min.js'></script>
        <script src='{{ mast_root }}/static/js/jquery-pubsub.js'></script>
        <script src='{{ mast_root }}/static/js/mast.js'></script>
        <script src='{{ mast_root }}/static/js/mast-util.js'></script>
        <title>M.A.S.T. for DP</title>
    </head>
    <body>
        <div id="title">McIndi Automated Solutions Tool for IBM DataPower</div>
        <hr />
        <img id="hiddenLoadingIMG" src="{{ mast_root }}/static/images/loading.gif" />

        <form id="addApplianceForm" class="centered">
            <b>Add an appliance</b><br />
            Hostname/Environment: <input type="textbox" name="hostname" />
            <input type="hidden" name="ephemeral_session" value="{{ ephemeral_session }}" />
            Username: <input type="textbox" name="username" />
            Password: <input type="password" name="password"/>
            <label><input type="checkbox" name="global_no_check_hostname" value="value">no_check_hostname</label>
            <input type="button" id="addAppliance" value="Add">
        </form>

        <div id="currentAppliances">
            <i>Current Appliances: </i>
        </div>

        <div id="main">
            <div id="tabs">
                <ul>
                    {{ plugins['tabs'] }}
                </ul>
                    {{ plugins['html'] }}
            </div>
        </div>
        <script src="{{ mast_root }}/plugins.js"></script>
    </body>
</html>
