# The posture rules of the crypto inventory (mast-crypto posture, the
# Crypto page). Put changes in etc/local/crypto.conf, which overrides
# this file option by option.

[rules]
# Rule ids to turn off, separated by commas. mast-crypto rules lists
# the rules.
disabled:

[expiry]
# A certificate that expires within this many days of the snapshot is
# a finding of this severity. One that has expired is critical.
high_days: 30
medium_days: 60
low_days: 90

[keys]
# An RSA key with fewer bits is a finding
rsa_min_bits: 2048

[credentials]
# A stored credential that no job used for this many days is a finding
unused_days: 180

[exceptions]
# The longest time an exception may last
max_days: 365

[score]
# The posture score of an appliance is 100 minus the weight of each
# finding that no exception covers, and never below 0
critical: 40
high: 15
medium: 5
low: 1
info: 0
