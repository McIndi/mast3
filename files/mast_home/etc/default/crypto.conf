# The posture rules of the crypto inventory (mast crypto posture, the
# Crypto page). Put changes in etc/local/crypto.conf, which overrides
# this file option by option.

[rules]
# Rule ids to turn off, separated by commas. mast crypto rules lists
# the rules.
disabled:

[expiry]
# A certificate that expires within this many days of the snapshot is
# a finding of this severity. One that has expired is critical.
high_days: 30
medium_days: 60
low_days: 90

[keys]
# An RSA key with fewer bits is a finding
rsa_min_bits: 2048

[credentials]
# A stored credential that no job used for this many days is a finding
unused_days: 180

[exceptions]
# The longest time an exception may last
max_days: 365

[score]
# The posture score of an appliance is 100 minus the weight of each
# finding that no exception covers, and never below 0
critical: 40
high: 15
medium: 5
low: 1
info: 0

[packs]
# Packs of rules to turn off, separated by commas: baseline, mast, pqc,
# cnsa. The cnsa pack (CNSA 2.0) is for the systems that must follow it.
disabled: cnsa

[pqc]
# NIST IR 8547: RSA under 3072 bits is deprecated after deprecated_year,
# and every RSA and elliptic-curve key is disallowed after
# disallowed_year. A certificate that runs past its year is a finding
# of low severity within 2 * lead_years of it, medium within lead_years,
# and high after it.
deprecated_year: 2030
disallowed_year: 2035
lead_years: 2
# A probe of a port is compared with a snapshot if it is at most this
# many days older than the snapshot
probe_max_age_days: 8

[cnsa]
# CNSA 2.0 for web servers and cloud services: preferred from
# prefer_year, the only choice from exclusive_year
prefer_year: 2025
exclusive_year: 2033
