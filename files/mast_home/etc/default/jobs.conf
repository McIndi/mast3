# The job queue. To change a value, put it in etc/local/jobs.conf.

[database]
# The SQLAlchemy URL of the database that holds the jobs. SQLite and
# PostgreSQL are supported. A relative SQLite path is relative to
# MAST_HOME. For PostgreSQL:
#   url = postgresql+psycopg://user:password@host/database
url = sqlite:///var/jobs/jobs.db

[worker]
# The number of seconds that a worker may be silent before its job is
# declared lost.
lease_seconds = 60
# The number of jobs that a worker runs at the same time.
concurrency = 1
# The number of seconds that a worker waits before it looks again
# when there was no job to take.
poll_seconds = 2
# The number of seconds between two looks of a running job at the queue,
# for a request to cancel it (mast-jobs cancel, the Cancel link of the
# web GUI). Each look reads one value from the database. A job stops at
# its next step, before its next request to an appliance.
cancel_poll_seconds = 1
# Whether mastd hosts a worker. Set this to false to run jobs only
# with mast-worker.
mastd = true

[secrets]
# The key that encrypts the credentials of the jobs that wait in the
# queue. MAST makes this file the first time it is needed. Every
# process that submits or runs jobs must read the same key.
key_file = etc/local/jobs.key

[credentials]
# The keys that encrypt the stored credentials (mast-credentials). MAST
# makes this file the first time it is needed, with one key on each
# line, the newest first (see mast-credentials rotate-key). It must be
# readable only by the account that runs MAST: MAST refuses to start
# the credential store if the group or others can read the file or its
# directory. Keep a copy of it with the backups of the database, and
# apart from them: without it the stored passwords cannot be read.
key_file = etc/local/credentials.key
# Where the keys come from. Only "file" (the key file above) is
# supported.
key_provider = file
