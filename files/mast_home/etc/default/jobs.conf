# The job queue. To change a value, put it in etc/local/jobs.conf.

[database]
# The SQLAlchemy URL of the database that holds the jobs. SQLite and
# PostgreSQL are supported. A relative SQLite path is relative to
# MAST_HOME. For PostgreSQL:
#   url = postgresql+psycopg://user:password@host/database
url = sqlite:///var/jobs/jobs.db

[worker]
# The number of seconds that a worker may be silent before its job is
# declared lost.
lease_seconds = 60
# The number of jobs that a worker runs at the same time.
concurrency = 1
# The number of passive jobs that a worker runs on top of those: jobs
# that only read and neither wait for nor hold up other jobs, such as
# the polls of the status of the appliances (mast-status collect). With
# one, a long backup or deployment does not stop the status from being
# updated. 0 turns this off.
passive_slots = 1
# The number of seconds that a worker waits before it looks again
# when there was no job to take.
poll_seconds = 2
# The number of seconds between two looks of a running job at the queue,
# for a request to cancel it (mast-jobs cancel, the Cancel link of the
# web GUI). Each look reads one value from the database. A job stops at
# its next step, before its next request to an appliance.
cancel_poll_seconds = 1
# Whether mastd hosts a worker. Set this to false to run jobs only
# with mast-worker.
mastd = true
# Whether a worker also puts the jobs of the schedules (mast-jobs
# schedule-add, Admin -> Schedules) in the queue when they are due, and
# deletes old things each day ([retention]). Any number of workers can
# do this: each run of a schedule is queued once. Set this to false
# for a worker that should only run jobs.
schedules = true

[secrets]
# The key that encrypts the credentials of the jobs that wait in the
# queue. MAST makes this file the first time it is needed. Every
# process that submits or runs jobs must read the same key.
key_file = etc/local/jobs.key

[credentials]
# The keys that encrypt the stored credentials (mast-credentials). MAST
# makes this file the first time it is needed, with one key on each
# line, the newest first (see mast-credentials rotate-key). It must be
# readable only by the account that runs MAST: MAST refuses to start
# the credential store if the group or others can read the file or its
# directory. Keep a copy of it with the backups of the database, and
# apart from them: without it the stored passwords cannot be read.
key_file = etc/local/credentials.key
# Where the keys come from. Only "file" (the key file above) is
# supported.
key_provider = file

[retention]
# The workers (see [worker] schedules) delete what is older than these
# numbers of days each day at this time (a cron expression, in UTC). Leave it empty to delete only
# with mast-jobs prune. 0 keeps that kind of thing for ever.
schedule = 30 3 * * *
# Finished jobs that people submitted, with their progress, results and
# files. A child job goes with its parent.
jobs_days = 90
# Finished jobs of schedules that succeeded, and those that did not
scheduled_jobs_days = 7
scheduled_failed_days = 30
# The record of each use of a stored credential, and of each change to
# the credentials (mast-credentials uses, audit)
credential_uses_days = 400
audit_events_days = 400
# Files uploaded in the web UI for a job (var/www/uploads)
uploads_days = 1
# Log files in var/log, and the folders that they leave empty
logs_days = 30
# The status of the appliances (mast-status collect): each poll, then
# the polls summed up by hour and by day. The daily ones are made from
# the hourly ones before these are deleted.
status_samples_days = 2
status_hourly_days = 31
status_daily_days = 400
# The snapshots of the crypto inventory (mast-crypto inventory), with
# their objects, certificates and files. The newest snapshot of each
# appliance is always kept.
crypto_snapshots_days = 400
