# **IMPORTANT**: Do not modify this file! Instead make your changes in
# MAST_HOME/etc/local/appliances.conf
#
# appliances.conf
#
# The defaults for every appliance, in the [global] section:
#
#     * soma_port - The port of the XML management interface (SOMA)
#     * web_port - The port of the DataPower WebGUI
#     * ssh_port - The port of the SSH interface
#     * soma_scheme - http or https
#     * soma_uri - The URI of SOMA
#     * soma_spec_file - The SOMA spec file for the firmware
#     * retry_interval - If a positive number, MAST tries a request to SOMA
#       again after this many seconds when it raised an exception. Zero or
#       a negative number turns this off.
#
# The settings of one appliance are in the appliance registry, in the
# MAST database, not in this file: `mast-appliances add` and
# `mast-appliances update` set them (for example --soma-port), and a
# setting that an appliance does not have takes the default from here.
# MAST 3.15.2 and older read sections for single appliances here;
# `mast-appliances import` moves them into the registry.

[global]
soma_port: 5550
web_port: 9090
ssh_port: 22
soma_scheme: https
soma_uri: /service/mgmt/current
soma_spec_file: etc/v11.0.0.3-C.xml
retry_interval: 0
