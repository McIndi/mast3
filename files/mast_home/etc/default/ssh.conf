# **IMPORTANT**: Do not modify this file! Instead make your changes in
# MAST_HOME/etc/local/mast.conf
#
# ssh.conf
#
# NOTE: Stanza headers are case-sensitive, option names are case-insensitive,
# and option values are case-sensitive
#
# This is used to specify a few options needed for MAST to connect to
# appliances via ssh
#
# The descriptions are as follows:
#
#    [ssh]
#    auto_add_keys - Whether to automatically add host keys to the list of
#                    known hosts, or to fail if the ssh server's host key is
#                    not trusted.
#
#    timeout - The timeout in seconds before a single command fails
#
# The sessions of the Terminal page of the web UI:
#
#    idle_minutes - A session that nobody used for this long is closed.
#    max_hours - A session is closed this long after it was opened.
#    max_sessions_per_user - How many sessions one user may have open.
#    max_appliances_per_session - How many appliances one session may
#                                 have (one pane each).
#    command_timeout - The longest that one line may run, in seconds.
#    connect_timeout - The longest that the login to one appliance may
#                      take, in seconds.

[ssh]
auto_add_keys = true
timeout = 20
idle_minutes = 15
max_hours = 8
max_sessions_per_user = 3
max_appliances_per_session = 20
command_timeout = 120
connect_timeout = 30
