name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install MAST and its dependencies
        run: |
          python -m pip install -r linux-requirements.txt pytest
          python -m pip install .
      - name: Run the unit and regression tests
        run: python -m pytest mast/testsuite/unit mast/testsuite/regression

  integration:
    runs-on: ubuntu-latest
    env:
      MAST_TEST_CONTAINER_RUNTIME: docker
      # The tests start an IBM DataPower "limited" image. That image is
      # licensed for non-production use, which includes these tests.
      MAST_TEST_DATAPOWER_ACCEPT_LICENSE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install MAST and its dependencies
        run: |
          python -m pip install -r linux-requirements.txt pytest
          python -m pip install .
      - name: Run the integration tests against a DataPower container
        run: python -m pytest mast/testsuite/integration
