name: tests

on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls this workflow, so that installers are only built from
  # a commit that passes the tests.
  workflow_call:

jobs:
  unit:
    runs-on: ubuntu-latest
    # The job queue tests run against SQLite, and against this
    # PostgreSQL because MAST_TEST_JOBS_DB_URL is set.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mast
          POSTGRES_PASSWORD: mast
          POSTGRES_DB: mast_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mast -d mast_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MAST_TEST_JOBS_DB_URL: postgresql+psycopg://mast:mast@localhost:5432/mast_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install MAST and its dependencies
        run: |
          python -m pip install -r linux-requirements.txt pytest
          python -m pip install .
      - name: Run the unit and regression tests
        run: python -m pytest mast/testsuite/unit mast/testsuite/regression

  integration:
    runs-on: ubuntu-latest
    env:
      MAST_TEST_CONTAINER_RUNTIME: docker
      # The tests start an IBM DataPower "limited" image. That image is
      # licensed for non-production use, which includes these tests.
      MAST_TEST_DATAPOWER_ACCEPT_LICENSE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install MAST and its dependencies
        run: |
          python -m pip install -r linux-requirements.txt pytest
          python -m pip install .
      - name: Run the integration tests against a DataPower container
        run: python -m pytest mast/testsuite/integration
