name: tests

on:
  # main is the 4.x line and version_3 is the 3.x line.
  push:
    branches: [main, version_3]
  pull_request:
  # release.yml calls this workflow, so that installers are only built from
  # a commit that passes the tests.
  workflow_call:

jobs:
  # The unit tests run on every Python that MAST supports (requires-python
  # in pyproject.toml). The other jobs use the Python of the installer.
  unit:
    name: unit (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14", "3.15"]
    # The job queue tests run against SQLite, and against this
    # PostgreSQL because MAST_TEST_JOBS_DB_URL is set.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mast
          POSTGRES_PASSWORD: mast
          POSTGRES_DB: mast_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mast -d mast_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MAST_TEST_JOBS_DB_URL: postgresql+psycopg://mast:mast@localhost:5432/mast_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: ${{ matrix.python }}
      - name: Check that uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Install MAST and its dependencies from uv.lock
        run: uv sync --locked
      - name: Show the Python version of the tests
        run: uv run --locked python -VV
      - name: Run the unit and regression tests
        run: uv run --locked pytest mast/testsuite/unit mast/testsuite/regression tools

  # Builds the installer and a development home with ./mast-setup, as
  # the release does, so that a broken build fails on the pull request.
  # The installed product is also tested on macOS, whose launchers and
  # daemon differ in small ways.
  mast-setup:
    name: mast-setup (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      MAST_SETUP_TEST_BUILD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.15"
      - uses: actions/cache@v4
        with:
          path: build-cache
          key: python-build-standalone-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: python-build-standalone-${{ runner.os }}-${{ runner.arch }}-
      - name: Install the test dependencies from uv.lock
        run: uv sync --locked
      - name: Build the installer and a development home
        run: uv run --locked pytest tools/mast_setup/tests/test_slow.py -v
      # The launchers, exit statuses, cancelled jobs and workers that
      # stop, with the installer that users get. No DataPower is needed.
      - name: Build the installer
        run: uv run --locked python mast-setup --log-level 30
      - name: Test the installed product
        run: |
          mkdir "$RUNNER_TEMP/mast"
          unzip -q dist/*.zip -d "$RUNNER_TEMP/mast"
          MAST_TEST_HOME="$RUNNER_TEMP/mast" uv run --locked pytest mast/testsuite/integration/test_installed.py -v

  # mastd as a Windows service, from the installer that users get: it is
  # installed with mastd.bat, runs a job and a scheduled task, and lets
  # its running job end when it is stopped. The runner is an
  # administrator, so the tests can install a service.
  windows-service:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.15"
      - uses: actions/cache@v4
        with:
          path: build-cache
          key: python-build-standalone-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: python-build-standalone-${{ runner.os }}-${{ runner.arch }}-
      - name: Install the test dependencies from uv.lock
        run: uv sync --locked
      - name: Build the installer
        run: uv run --locked python mast-setup --log-level 30
      - name: Unzip the installer
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\*.zip
          Expand-Archive -Path $zip.FullName -DestinationPath "$env:RUNNER_TEMP\mast"
      - name: Test the Windows service
        shell: pwsh
        env:
          MAST_TEST_WINDOWS_SERVICE: "true"
        run: |
          $env:MAST_TEST_HOME = "$env:RUNNER_TEMP\mast"
          uv run --locked pytest mast/testsuite/integration/test_windows_service.py -v -s
      - name: Show the events of the service
        if: failure()
        shell: pwsh
        run: |
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddHours(-1)} -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -match 'mastd|Python|Service' } |
            Format-List TimeCreated, ProviderName, Id, Message
          Get-WinEvent -FilterHashtable @{LogName='System'; ProviderName='Service Control Manager'; StartTime=(Get-Date).AddHours(-1)} -ErrorAction SilentlyContinue |
            Format-List TimeCreated, Id, Message
      - name: Keep the logs of MAST
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-service-logs
          path: ${{ runner.temp }}/mast/var/log

  integration:
    runs-on: ubuntu-latest
    env:
      MAST_TEST_CONTAINER_RUNTIME: docker
      # The tests start an IBM DataPower "limited" image. That image is
      # licensed for non-production use, which includes these tests.
      MAST_TEST_DATAPOWER_ACCEPT_LICENSE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.15"
      - name: Install MAST and its dependencies from uv.lock
        run: uv sync --locked
      - name: Run the integration tests against a DataPower container
        run: uv run --locked pytest mast/testsuite/integration
