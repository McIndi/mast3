name: tests

on:
  push:
    branches: [main]
  pull_request:
  # release.yml calls this workflow, so that installers are only built from
  # a commit that passes the tests.
  workflow_call:

jobs:
  unit:
    runs-on: ubuntu-latest
    # The job queue tests run against SQLite, and against this
    # PostgreSQL because MAST_TEST_JOBS_DB_URL is set.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: mast
          POSTGRES_PASSWORD: mast
          POSTGRES_DB: mast_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mast -d mast_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MAST_TEST_JOBS_DB_URL: postgresql+psycopg://mast:mast@localhost:5432/mast_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
      - name: Check that uv.lock matches pyproject.toml
        run: uv lock --check
      - name: Install MAST and its dependencies from uv.lock
        run: uv sync --locked
      - name: Run the unit and regression tests
        run: uv run --locked pytest mast/testsuite/unit mast/testsuite/regression tools

  # Builds the installer and a development home with ./mast-setup, as
  # the release does, so that a broken build fails on the pull request.
  mast-setup:
    runs-on: ubuntu-latest
    env:
      MAST_SETUP_TEST_BUILD: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
      - uses: actions/cache@v4
        with:
          path: build-cache
          key: python-build-standalone-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: python-build-standalone-${{ runner.os }}-${{ runner.arch }}-
      - name: Install the test dependencies from uv.lock
        run: uv sync --locked
      - name: Build the installer and a development home
        run: uv run --locked pytest tools/mast_setup/tests/test_slow.py -v

  integration:
    runs-on: ubuntu-latest
    env:
      MAST_TEST_CONTAINER_RUNTIME: docker
      # The tests start an IBM DataPower "limited" image. That image is
      # licensed for non-production use, which includes these tests.
      MAST_TEST_DATAPOWER_ACCEPT_LICENSE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.14"
      - name: Install MAST and its dependencies from uv.lock
        run: uv sync --locked
      - name: Run the integration tests against a DataPower container
        run: uv run --locked pytest mast/testsuite/integration
