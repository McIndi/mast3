name: release

# Builds the MAST installers when a version tag is pushed, and attaches them
# to a published GitHub release. The installers are only built if the unit and
# integration tests pass for the tagged commit, and if no package of uv.lock
# has a known vulnerability. The release also gets the report of that check
# and a software bill of materials (SBOM) of the packages.

on:
  push:
    tags: ["v*"]
  # A manual run builds and checks the installers for any branch, but does
  # not create a release.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # There are two release lines: main is 4.x and later, and version_3 is
  # 3.x. A tag must be on the branch of its line, so that nothing is built
  # from a commit of the other line.
  line:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.line.outputs.latest }}
      notes_start: ${{ steps.line.outputs.notes_start }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check that the tag is on the branch of its line
        id: line
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then exit 0; fi
          case "$GITHUB_REF_NAME" in
            v3.*) branch=version_3; line="v3.*" ;;
            *) branch=main; line="v[4-9].*" ;;
          esac
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$branch"; then
            echo "::error::Tag $GITHUB_REF_NAME is not on $branch, the branch of its release line."
            exit 1
          fi
          # Only the highest release (a tag without a -suffix) is Latest
          # on GitHub, so that a 3.x fix after 4.0 does not take its place.
          highest=$(git tag -l 'v*' | grep -v -e '-' | sort -V | tail -n 1)
          if [ "$GITHUB_REF_NAME" = "$highest" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi
          # The notes list the changes since the previous release of the
          # same line, not since a release of the other line.
          previous=$(git describe --tags --abbrev=0 --match "$line" --exclude '*-*' "$GITHUB_SHA^" 2>/dev/null || true)
          echo "notes_start=$previous" >> "$GITHUB_OUTPUT"

  tests:
    needs: line
    uses: ./.github/workflows/tests.yml

  audit:
    needs: line
    uses: ./.github/workflows/audit.yml

  build:
    needs: [tests, audit]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest      # linux, x86_64
          - os: windows-latest     # windows, x86_64
          - os: macos-latest       # darwin, arm64 (Apple silicon)
          - os: macos-15-intel     # darwin, x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # setup-python runs ./mast-setup. The installer bundles its own
      # interpreter from python-build-standalone.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      # mast-setup installs the dependencies of uv.lock with uv.
      - uses: astral-sh/setup-uv@v10.3.3
      # The interpreter is pinned in pyproject.toml, so the download can be
      # cached by that file.
      - uses: actions/cache@v4
        with:
          path: build-cache
          key: python-build-standalone-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: python-build-standalone-${{ runner.os }}-${{ runner.arch }}-

      - name: Check that the tag matches the MAST version
        shell: bash
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "MAST_VERSION=$version" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then exit 0; fi
          case "$GITHUB_REF_NAME" in
            "v$version" | "v$version"-*) ;;
            *)
              echo "::error::Tag $GITHUB_REF_NAME does not match version $version in pyproject.toml. The tag must be v$version, or v$version-<suffix>."
              exit 1
              ;;
          esac

      - name: Build the installer
        run: python mast-setup --log-level 20

      - name: Run the installer (Linux and macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir "$RUNNER_TEMP/mast"
          unzip -q dist/*.zip -d "$RUNNER_TEMP/mast"
          "$RUNNER_TEMP/mast/mast" version | tee version.txt
          grep -F "Version $MAST_VERSION" version.txt
          # The console scripts of the bundled Python must work from
          # another folder, with no MAST_HOME, once the build folder is
          # gone. They find MAST_HOME from their interpreter.
          mv build/assemble build/assemble.moved
          cd /
          "$RUNNER_TEMP"/mast/python/*/bin/mast version | grep -F "Version $MAST_VERSION"
          # mast plugins list needs the home, and loads the commands of
          # each plugin
          "$RUNNER_TEMP"/mast/python/*/bin/mast plugins list | grep -E "^datapower .* loaded"
          "$RUNNER_TEMP"/mast/python/*/bin/pip3 --version

      # The launchers, exit statuses, cancelled jobs and workers that
      # stop. The Windows launchers are batch files, see manual-tests.md.
      - name: Test the installed product (Linux and macOS)
        if: runner.os != 'Windows'
        env:
          MAST_TEST_HOME: ${{ runner.temp }}/mast
        run: uv run --locked pytest mast/testsuite/integration/test_installed.py -v

      # A jump server has no internet access. Run the installer in a
      # container with no network, in an image with the oldest glibc that
      # the installer supports (linux-glibc in pyproject.toml: 2.28, as
      # in RHEL 8). mast selftest runs the unit tests from inside the bundle,
      # which also checks that their imports (mock and so on) are there.
      - name: Run the installer with no network (Linux)
        if: runner.os == 'Linux'
        run: |
          docker run --rm --network=none -v "$RUNNER_TEMP/mast:/opt/mast" \
            almalinux:8-minimal bash -c '
              set -e
              ldd --version | head -n 1
              /opt/mast/mast version
              /opt/mast/mast selftest --unit
              /opt/mast/mast datapower xor -s user:pass
              cd / && /opt/mast/python/*/bin/mast version
              if /opt/mast/mast -c "import urllib.request; urllib.request.urlopen(\"https://pypi.org\", timeout=10)" 2>/dev/null; then
                echo "The container reached the internet, so this check proves nothing"
                exit 1
              fi
              echo "The installer works with no network"
            '

      - name: Run the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\*.zip
          Expand-Archive -Path $zip.FullName -DestinationPath "$env:RUNNER_TEMP\mast"
          $output = & "$env:RUNNER_TEMP\mast\mast.bat" version | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $output.Contains("Version $env:MAST_VERSION")) {
            Write-Error "The installer did not report version $env:MAST_VERSION"
            exit 1
          }
          # The console script launchers must work from another folder,
          # with no MAST_HOME, once the build folder is gone.
          Rename-Item build\assemble assemble.moved
          Set-Location $env:RUNNER_TEMP
          $script = Get-ChildItem "$env:RUNNER_TEMP\mast\python\*\Scripts\mast.exe"
          $output = & $script.FullName version | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $output.Contains("Version $env:MAST_VERSION")) {
            Write-Error "Scripts\mast.exe did not report version $env:MAST_VERSION"
            exit 1
          }
          # mast plugins list needs the home, and loads the commands of
          # each plugin
          $output = & $script.FullName plugins list | Out-String
          Write-Host $output
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not ($output -match "(?m)^datapower .* loaded")) {
            Write-Error "Scripts\mast.exe did not load the DataPower plugin"
            exit 1
          }
          # The launchers return the exit status of Python.
          & "$env:RUNNER_TEMP\mast\mast-python.bat" -c "import sys; sys.exit(3)"
          if ($LASTEXITCODE -ne 3) {
            Write-Error "mast-python.bat returned $LASTEXITCODE, not the exit status 3 of Python"
            exit 1
          }
          & "$env:RUNNER_TEMP\mast\mast.bat" selftest --unit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error
          # The archive is already compressed.
          compression-level: 0

  release:
    needs: [line, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: installer-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: audit
          path: audit
      - name: Publish a release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          LATEST: ${{ needs.line.outputs.latest }}
          NOTES_START: ${{ needs.line.outputs.notes_start }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp audit/pip-audit.json "dist/MAST-${version}_pip-audit.json"
          cp audit/sbom.cdx.json "dist/MAST-${version}_sbom.cdx.json"
          ls -l dist
          (cd dist && sha256sum *.zip *.json > SHA256SUMS)
          flags=("--latest=$LATEST")
          case "$GITHUB_REF_NAME" in *-*) flags=(--prerelease --latest=false) ;; esac
          if [ -n "$NOTES_START" ]; then flags+=(--notes-start-tag "$NOTES_START"); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag --generate-notes "${flags[@]}" \
            --title "MAST $GITHUB_REF_NAME"
